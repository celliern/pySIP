[tool.poetry]
name = "pysip"
version = "1.0.0"
description = "PySIP"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
numpy = "^2.5"
scipy = "^1.18"
pandas = "^3.1"
matplotlib = "^3.11"
pylfsr = "^1.0.7"
arviz = "^1.3"
pydantic = "^2.14"
jinja2 = "^3.1.6"
# PyTensor 3.3 requires Numba <=0.68.0.
numba = ">=0.68,<0.68.1"
flatten-dict = "^0.5"
pymc = "^6.4"
pytensor = ">=3.3.6,<3.4"
loguru = "^0.7.3"
makefun = "^1.16"
xarray = ">=2026.9,<2027"
typing-extensions = "^4.16"
jax = {version = ">=0.12.0.1,<0.13", optional = true}

[tool.poetry.extras]
jax = ["jax"]


[tool.poetry.group.docs.dependencies]
zensical = "^0.1.1"
mkdocstrings-python = "^2.0.10"
nbconvert = "^7.17.2"


[tool.poetry.group.tests.dependencies]
pytest = "^9.2"
pytest-cov = "^7.1"
xdoctest = "^1.3"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.7"
ruff = "^0.17"
pyright = "^1.1.414"


[tool.poetry.group.interactive.dependencies]
ipykernel = "^7.4"


[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = ["tests/*"]


[tool.isort]
profile = "black"

[tool.pyright]
include = ["pysip"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
